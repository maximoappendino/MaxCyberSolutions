name = "maxcybersolutions"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# ── D1 Database ────────────────────────────────────────────────────────────────
# 1. Run: wrangler d1 create maxcybersolutions-db
# 2. Paste the returned database_id below
[[d1_databases]]
binding      = "DB"
database_name = "maxcybersolutions-db"
database_id  = "556d54dd-e2de-4c18-bfd4-8b5ba82b4c99"

# ── R2 Object Storage ─────────────────────────────────────────────────────────
# 1. Run: wrangler r2 bucket create maxcybersolutions-assets
[[r2_buckets]]
binding     = "ASSETS_BUCKET"
bucket_name = "maxcybersolutions-assets"

# ── Environment vars ──────────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
PUBLIC_URL  = "https://maxcybersolutions.online"
# Mercado Pago — Maximo's account (for platform billing + webhook verification)
# Set via: wrangler secret put MP_ACCESS_TOKEN
# MP_ACCESS_TOKEN = ""
# Andreani shipping API credentials
# Set via: wrangler secret put ANDREANI_USER / ANDREANI_PASS / ANDREANI_CONTRATO
# ANDREANI_USER     = ""
# ANDREANI_PASS     = ""
# ANDREANI_CONTRATO = ""
# Resend email API key — get free key at resend.com
# Set via: wrangler secret put RESEND_API_KEY
# RESEND_API_KEY = ""
